# Install once with `pip install pre-commit && pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: bash -c 'cd backend && uv run ruff check --fix . && uv run ruff format .'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy app tests'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: frontend
        name: eslint + prettier + tsc (frontend)
        entry: bash -c 'cd frontend && npm run lint && npm run format:check && npm run typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false
