area: tasks
features:
  # --- Wedding tasks ----------------------------------------------------------------------
  - id: tasks.wedding-tasks
    title: Tasks of a wedding
    group: tasks.wedding
    summary: "All tasks of a wedding grouped by milestone, with due date, assignee, checklist and who they are for."
    usage:
      - channel: web
        text: "Wedding → **Tasks** (`/app/weddings/:id/tasks`) → **New task**; filter for the couple's tasks."
      - channel: api
        text: "`GET`/`POST …/projects/{project_id}/tasks`, `GET …/tasks/{task_id}`."
    rules:
      - "Only people on the wedding can be assigned (`invalid_assignee`)."
      - "Viewers read and comment but do not create or complete tasks (`403`)."
    technical:
      components:
        - backend/app/tasks/service.py
        - frontend/src/features/tasks/WeddingTasksPage.tsx
        - frontend/src/features/tasks/TaskDialog.tsx
      endpoints:
        - "GET /orgs/{org_id}/projects/{project_id}/tasks"
        - "POST /orgs/{org_id}/projects/{project_id}/tasks"
        - "GET /orgs/{org_id}/projects/{project_id}/tasks/{task_id}"
      uiRoutes:
        - /app/weddings/:id/tasks
    acceptance:
      - id: listed
        kind: effect
        text: "A new wedding lists its 19 template tasks with milestones; the couple filter shows only shared tasks."
      - id: create
        kind: effect
        text: "A task created with milestone, due date, priority, assignee and two checklist items shows all of them."
      - id: assignee
        kind: rule
        text: "Assigning someone who is not on the wedding is refused; the org admin can be assigned."
        code: invalid_assignee
      - id: viewers
        kind: rule
        text: "A viewer reads a task and comments on it but cannot create or complete tasks."
        code: "403"
      - id: list-ui
        kind: effect
        text: "The task page groups tasks by milestone, shows who they are for and filters the couple's tasks."
    evidence:
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_template_tasks_are_listed_with_milestones
        covers: [listed]
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_create_task_with_checklist_and_assignee
        covers: [create]
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_assignee_must_be_on_the_wedding
        covers: [assignee]
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_viewers_read_and_comment_but_do_not_edit
        covers: [viewers]
      - kind: unit
        file: frontend/src/features/tasks/tasks.test.tsx
        test: groups tasks by milestone and shows who they are for
        covers: [list-ui]
      - kind: unit
        file: frontend/src/features/tasks/tasks.test.tsx
        test: filters tasks for the couple
        covers: [list-ui]

  - id: tasks.edit-complete
    title: Edit, complete, sort and delete tasks
    group: tasks.wedding
    summary: "Planners edit tasks, tick them off, reopen them, sort them and delete them; sharing a task with the couple is recorded."
    usage:
      - channel: web
        text: "Tick a task in the list, or open it to edit; drag to sort."
      - channel: api
        text: "`PATCH`/`DELETE …/tasks/{task_id}` (with `If-Match`), `POST …/complete|reopen`, `POST …/tasks/reorder`."
    rules:
      - "Edits need the current version (`stale_version`)."
      - Sharing a task with the couple is recorded in the audit log.
    technical:
      components:
        - backend/app/tasks/service.py
        - frontend/src/features/tasks/TaskDialog.tsx
        - frontend/src/features/tasks/TaskRow.tsx
      endpoints:
        - "PATCH /orgs/{org_id}/projects/{project_id}/tasks/{task_id}"
        - "DELETE /orgs/{org_id}/projects/{project_id}/tasks/{task_id}"
        - "POST /orgs/{org_id}/projects/{project_id}/tasks/{task_id}/complete"
        - "POST /orgs/{org_id}/projects/{project_id}/tasks/{task_id}/reopen"
        - "POST /orgs/{org_id}/projects/{project_id}/tasks/reorder"
    acceptance:
      - id: versioned-edit
        kind: rule
        text: "An edit with the current version is saved; a second edit with the same old version is refused."
        code: stale_version
      - id: shared-audited
        kind: effect
        text: "Sharing a task with the couple is recorded in the audit log with the planner's name."
      - id: complete-reopen
        kind: effect
        text: "Completing a task marks it done; reopening clears who completed it."
      - id: reorder-delete
        kind: effect
        text: "Two tasks on the same day swap places after sorting; a deleted task is gone."
      - id: complete-ui
        kind: effect
        text: "Ticking a task in the list completes it; editing sends the version it is based on."
      - id: e2e-tasks
        kind: effect
        text: "In the browser, a planner completes a template task, adds and shares a task, comments on it, sees both in the activity feed and finds the task under My tasks."
    evidence:
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_task_updates_need_the_current_version
        covers: [versioned-edit]
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_sharing_a_task_with_the_couple_is_audited
        covers: [shared-audited]
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_completing_all_tasks_completes_the_milestone
        covers: [complete-reopen]
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_reorder_and_delete_tasks
        covers: [reorder-delete]
      - kind: unit
        file: frontend/src/features/tasks/tasks.test.tsx
        test: completes a task from the list
        covers: [complete-ui]
      - kind: unit
        file: frontend/src/features/tasks/tasks.test.tsx
        test: edits a task with its version and posts a comment
        covers: [complete-ui]
      - kind: e2e
        file: frontend/e2e/tasks.spec.ts
        test: a planner works through tasks, shares one with the couple and comments
        covers: [e2e-tasks]

  - id: tasks.checklists
    title: Checklists in tasks
    group: tasks.wedding
    summary: "A task can hold a checklist of small steps that are ticked off one by one."
    usage:
      - channel: web
        text: "Open a task → checklist."
      - channel: api
        text: "`POST …/tasks/{task_id}/checklist`, `PATCH`/`DELETE …/checklist/{item_id}`."
    technical:
      components:
        - backend/app/tasks/service.py
        - frontend/src/features/tasks/TaskDialog.tsx
      endpoints:
        - "POST /orgs/{org_id}/projects/{project_id}/tasks/{task_id}/checklist"
        - "PATCH /orgs/{org_id}/projects/{project_id}/tasks/{task_id}/checklist/{item_id}"
        - "DELETE /orgs/{org_id}/projects/{project_id}/tasks/{task_id}/checklist/{item_id}"
    acceptance:
      - id: tick-add
        kind: effect
        text: "Ticking an item counts it as done; an added item appears at the end."
      - id: rename-remove
        kind: effect
        text: "A renamed item shows its new title; a removed item is gone and the count drops."
    evidence:
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_checklist_items
        covers: [tick-add]
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_checklist_items_are_renamed_and_removed
        covers: [rename-remove]

  - id: tasks.my-tasks
    title: My tasks
    group: tasks.wedding
    summary: "Each planner sees the tasks assigned to them across all their weddings, sorted by due date."
    usage:
      - channel: web
        text: "**My tasks** (`/app/tasks`): overdue, this week, later."
      - channel: api
        text: "`GET /orgs/{org_id}/tasks`."
    rules:
      - Tasks of weddings the person is not on stay hidden.
    technical:
      components:
        - backend/app/tasks/service.py
        - frontend/src/features/tasks/MyTasksPage.tsx
      endpoints:
        - "GET /orgs/{org_id}/tasks"
      uiRoutes:
        - /app/tasks
    acceptance:
      - id: across-weddings
        kind: effect
        text: "A planner's tasks from two weddings are listed by due date; a colleague without tasks sees none."
      - id: hidden
        kind: rule
        text: "A task cannot be opened through another wedding, and outsiders get 'not found'."
        code: "404"
      - id: groups-ui
        kind: effect
        text: "The page groups the tasks into overdue, this week and later."
    evidence:
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_my_tasks_across_weddings
        covers: [across-weddings]
      - kind: integration
        file: backend/tests/test_tasks.py
        test: test_tasks_of_inaccessible_weddings_are_hidden
        covers: [hidden]
      - kind: unit
        file: frontend/src/features/tasks/tasks.test.tsx
        test: groups my tasks into overdue, this week and later
        covers: [groups-ui]

  # --- Tasks for the couple ---------------------------------------------------------------
  - id: tasks.couple-tasks
    title: Tasks for the couple
    group: tasks.couple
    summary: "The couple sees the shared tasks in their portal, ticks off their own, works through checklists and writes comments."
    usage:
      - channel: portal
        text: "**Tasks** (`/portal/tasks`)."
      - channel: api
        text: "`/portal/projects/{project_id}/tasks…` (list, complete, reopen, checklist, comments)."
    rules:
      - "The couple completes only tasks meant for them (`not_your_task`); internal tasks do not exist for them."
      - Comments of the couple reach the planner as shared comments.
    dependsOn: [portal.isolation]
    technical:
      components:
        - backend/app/portal/service.py
        - frontend/src/features/portal/PortalTasksPage.tsx
      endpoints:
        - "GET /portal/projects/{project_id}/tasks"
        - "POST /portal/projects/{project_id}/tasks/{task_id}/complete"
        - "POST /portal/projects/{project_id}/tasks/{task_id}/reopen"
        - "PATCH /portal/projects/{project_id}/tasks/{task_id}/checklist/{item_id}"
        - "GET /portal/projects/{project_id}/tasks/{task_id}/comments"
        - "POST /portal/projects/{project_id}/tasks/{task_id}/comments"
      uiRoutes:
        - /portal/tasks
    acceptance:
      - id: own-tasks
        kind: rule
        text: "The couple completes their task; a team task is refused and an internal task is 'not found'; the planner's feed shows the couple's step."
        code: not_your_task
      - id: checklist-reopen
        kind: effect
        text: "The couple ticks a checklist item, which the planner then sees, and reopens a task they completed."
      - id: comments
        kind: effect
        text: "A comment of the couple on a task appears in their own list and for the planner with the couple's name as shared."
      - id: portal-ui
        kind: effect
        text: "In the portal only the couple's own tasks can be ticked; team tasks say the planner takes care of them."
    evidence:
      - kind: integration
        file: backend/tests/test_budget_portal.py
        test: test_couple_completes_only_their_own_tasks
        covers: [own-tasks]
      - kind: integration
        file: backend/tests/test_budget_portal.py
        test: test_couple_ticks_checklist_items_and_reopens_their_task
        covers: [checklist-reopen]
      - kind: integration
        file: backend/tests/test_budget_portal.py
        test: test_couple_comments_reach_the_planner
        covers: [comments]
      - kind: unit
        file: frontend/src/features/portal/portal.test.tsx
        test: lets the couple tick only their own tasks
        covers: [portal-ui]

  # --- Templates ----------------------------------------------------------------------------
  - id: tasks.templates
    title: Planning templates
    group: tasks.templates
    summary: "Templates hold the studio's standard milestones and tasks with offsets from the wedding date; new weddings start from them."
    description: |
      Every studio starts with a default template of six milestones and 19 tasks. Admins copy,
      edit and delete templates and choose the default; planners use them read only. Offsets are
      entered in days, weeks or months before or after the wedding.
    usage:
      - channel: web
        text: "**Templates** (`/app/templates`) → open a template → add milestones and tasks."
      - channel: api
        text: "`/orgs/{org_id}/templates…` (list, create with `copy_from`, edit, items, delete)."
    rules:
      - "Only org admins change templates (`403` for planners)."
      - "Template tasks belong to a milestone of the same template (`invalid_parent`)."
      - Exactly one template is the default.
    technical:
      components:
        - backend/app/templates/service.py
        - frontend/src/features/templates/TemplatesPage.tsx
        - frontend/src/features/templates/TemplatePage.tsx
        - frontend/src/lib/format.ts
      endpoints:
        - "GET /orgs/{org_id}/templates"
        - "POST /orgs/{org_id}/templates"
        - "GET /orgs/{org_id}/templates/{template_id}"
        - "PATCH /orgs/{org_id}/templates/{template_id}"
        - "DELETE /orgs/{org_id}/templates/{template_id}"
        - "POST /orgs/{org_id}/templates/{template_id}/items"
        - "PATCH /orgs/{org_id}/templates/{template_id}/items/{item_id}"
        - "DELETE /orgs/{org_id}/templates/{template_id}/items/{item_id}"
      uiRoutes:
        - /app/templates
        - /app/templates/:id
    acceptance:
      - id: default-and-copy
        kind: effect
        text: "Planners read the default template with 6 milestones and 19 tasks; an admin's copy has the same items, each task under a milestone of the copy."
      - id: admins-only
        kind: rule
        text: "A planner cannot create a template."
        code: "403"
      - id: same-template
        kind: rule
        text: "A task cannot hang under a milestone of another template."
        code: invalid_parent
      - id: edit-default-delete
        kind: effect
        text: "An item's offset is changed, the template renamed and made the only default; a removed item and a deleted template are gone."
      - id: editor-ui
        kind: effect
        text: "Adding a task given in weeks stores it in days under its milestone; planners see the template read only; offsets read as months, weeks or days."
    evidence:
      - kind: integration
        file: backend/tests/test_clients_vendors_templates.py
        test: test_templates_are_read_by_planners_and_managed_by_admins
        covers: [default-and-copy, admins-only]
      - kind: integration
        file: backend/tests/test_clients_vendors_templates.py
        test: test_template_tasks_must_belong_to_a_milestone_of_the_same_template
        covers: [same-template]
      - kind: integration
        file: backend/tests/test_clients_vendors_templates.py
        test: test_templates_are_edited_made_default_and_deleted
        covers: [edit-default-delete]
      - kind: unit
        file: frontend/src/features/templates/templates.test.tsx
        test: adds a task to a milestone, converting weeks to days
        covers: [editor-ui]
      - kind: unit
        file: frontend/src/features/templates/templates.test.tsx
        test: is read-only for planners
        covers: [editor-ui]
      - kind: unit
        file: frontend/src/features/templates/templates.test.tsx
        test: describes offsets in readable units
        covers: [editor-ui]
