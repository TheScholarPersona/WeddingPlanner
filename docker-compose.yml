# Local pilot environment. Start everything with `make up` (or `docker compose up --build`).
# App: https://localhost · Mailpit: http://localhost:8025 · S3 storage: http://localhost:8333

x-backend-env: &backend-env
  ENVIRONMENT: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://app_user:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
  MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://storage:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-documents}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - frontend

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: arq app.jobs.worker.WorkerSettings --watch app
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  # S3-compatible object storage (SeaweedFS; MinIO no longer publishes community images).
  storage:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ["/bin/sh", "/docker/seaweedfs-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/docker/seaweedfs-entrypoint.sh:ro
      - storagedata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

  # Virus scanning for uploads (needed from Sprint 5). Opt-in: `docker compose --profile scan up`.
  # ClamAV publishes amd64 images only; Apple Silicon runs it through emulation.
  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    profiles: ["scan"]
    volumes:
      - clamavdata:/var/lib/clamav

volumes:
  caddy_data:
  pgdata:
  redisdata:
  storagedata:
  clamavdata:
