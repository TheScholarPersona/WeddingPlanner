name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # Pango and HarfBuzz for the moodboard PDFs (WeasyPrint), as in backend/Dockerfile.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest -o junit_suite_name=backend --junitxml=../reports/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-backend
          path: reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
        env:
          JUNIT_DIR: ${{ github.workspace }}/reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-frontend-unit
          path: reports/
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off
        env:
          JUNIT_DIR: ${{ github.workspace }}/reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: reports/

  # Feature catalog: checks catalog/ against the code and all test reports (docs/feature-katalog.md).
  catalog:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - working-directory: tools/feature_catalog
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy feature_catalog tests
          uv run pytest --junitxml=../../reports/catalog-tool.xml
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: reports
          merge-multiple: true
      - name: Check the catalog against code and test reports
        working-directory: tools/feature_catalog
        run: uv run python -m feature_catalog check --root ../.. --reports ../../reports
      - name: Build the catalog view
        if: always()
        working-directory: tools/feature_catalog
        run: uv run python -m feature_catalog build --root ../.. --reports ../../reports --out catalog/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-catalog
          path: catalog/dist/
