name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # Pango and HarfBuzz for the moodboard PDFs (WeasyPrint), as in backend/Dockerfile.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest -o junit_suite_name=backend --junitxml=../reports/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-backend
          path: reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
        env:
          JUNIT_DIR: ${{ github.workspace }}/reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-frontend-unit
          path: reports/
      - run: npm run build

  # End-to-end tests against the whole platform (Caddy, API, worker, PostgreSQL, Redis, S3,
  # Mailpit) started with Docker Compose, in desktop and phone viewports.
  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the platform
        run: |
          cp .env.example .env
          docker compose up --build -d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait until API and app answer
        run: |
          for i in $(seq 1 120); do
            if curl -skf https://localhost/api/v1/health >/dev/null && curl -skf https://localhost/login >/dev/null; then
              echo "Platform is up"; exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=80
          exit 1
      - name: Playwright (full stack)
        working-directory: frontend
        run: npx playwright test --trace off
        env:
          E2E_FULL_STACK: "1"
          E2E_BASE_URL: https://localhost
          JUNIT_DIR: ${{ github.workspace }}/reports
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=150 api worker frontend proxy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: reports/

  # Feature catalog: checks catalog/ against the code and all test reports (docs/feature-katalog.md).
  catalog:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - working-directory: tools/feature_catalog
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy feature_catalog tests
          uv run pytest --junitxml=../../reports/catalog-tool.xml
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: reports
          merge-multiple: true
      - name: Check the catalog against code and test reports
        working-directory: tools/feature_catalog
        run: uv run python -m feature_catalog check --root ../.. --reports ../../reports
      - name: Build the catalog view
        if: always()
        working-directory: tools/feature_catalog
        run: uv run python -m feature_catalog build --root ../.. --reports ../../reports --out catalog/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-catalog
          path: catalog/dist/
