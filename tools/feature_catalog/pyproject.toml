[project]
name = "feature-catalog"
version = "0.1.0"
description = "Checks catalog/ against the code and test reports and builds the catalog view."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
    "ruamel.yaml>=0.18.10",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_suite_name = "feature-catalog"
