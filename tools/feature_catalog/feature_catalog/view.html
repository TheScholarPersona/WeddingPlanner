<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #faf8f5; --surface: #ffffff; --ink: #1f1c19; --muted: #6b645c; --line: #e6e0d8;
  --accent: #8a5a44; --accent-soft: #f3e9e3; --ok: #2f7a4f; --ok-soft: #e3f2e8;
  --warn: #9a6400; --warn-soft: #fbf0d9; --bad: #b3372f; --bad-soft: #f9e3e1;
  --code: #f2eee9; --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171513; --surface: #201d1a; --ink: #ede8e2; --muted: #a39b91; --line: #37322d;
    --accent: #e0a98c; --accent-soft: #3a2b23; --ok: #7fcf9c; --ok-soft: #1f3327;
    --warn: #e6b65c; --warn-soft: #3a2f19; --bad: #f08c82; --bad-soft: #3d221f;
    --code: #2a2622; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171513; --surface: #201d1a; --ink: #ede8e2; --muted: #a39b91; --line: #37322d;
  --accent: #e0a98c; --accent-soft: #3a2b23; --ok: #7fcf9c; --ok-soft: #1f3327;
  --warn: #e6b65c; --warn-soft: #3a2f19; --bad: #f08c82; --bad-soft: #3d221f;
  --code: #2a2622; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
code { background: var(--code); padding: 0 4px; border-radius: 4px; font-size: 0.9em;
  overflow-wrap: anywhere; }
a { color: var(--accent); }
header { padding: 20px 16px 12px; max-width: 1280px; margin: 0 auto; }
header h1 { margin: 0 0 4px; font-size: 1.6rem; }
.sub { color: var(--muted); font-size: 0.85rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px;
  margin-top: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; }
.stat b { display: block; font-size: 1.35rem; }
.stat span { color: var(--muted); font-size: 0.8rem; }
.bar { max-width: 1280px; margin: 0 auto; padding: 0 16px; display: flex; flex-wrap: wrap;
  gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; }
.tabs button, .theme { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--surface);
  border-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; justify-content: flex-end; }
input[type=search], select { border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 0;
  max-width: 100%; }
select { max-width: 220px; text-overflow: ellipsis; }
input[type=search] { flex: 1 1 220px; max-width: 360px; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid;
  grid-template-columns: 260px minmax(0, 1fr); gap: 20px; }
nav { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px);
  overflow: auto; }
nav button { display: block; width: 100%; text-align: left; border: 0; background: none;
  color: var(--ink); padding: 5px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button:hover, nav button.active { background: var(--accent-soft); }
nav .group { padding-left: 20px; font-size: 0.88rem; color: var(--muted); }
nav .count { float: right; color: var(--muted); font-size: 0.8rem; }
.area-head { margin: 8px 0 12px; }
.area-head h2 { margin: 0; font-size: 1.3rem; }
.group-title { margin: 18px 0 8px; font-size: 1rem; color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 10px; }
.card h3 { margin: 0; font-size: 1.05rem; }
.card .id { color: var(--muted); font-size: 0.78rem; font-family: ui-monospace, monospace; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--code);
  color: var(--muted); }
.chip.proven, .chip.passed { background: var(--ok-soft); color: var(--ok); }
.chip.partial, .chip.static, .chip.not-checked, .chip.warning { background: var(--warn-soft);
  color: var(--warn); }
.chip.unproven, .chip.failed, .chip.skipped, .chip.not-run, .chip.no-report, .chip.error,
.chip.state { background: var(--bad-soft); color: var(--bad); }
.card h4 { margin: 12px 0 4px; font-size: 0.85rem; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); }
.card ul { margin: 0; padding-left: 20px; }
.crit { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; }
.crit .mark { flex: none; width: 1.2em; text-align: center; }
.crit .ok { color: var(--ok); } .crit .no { color: var(--bad); }
details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; margin-top: 6px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line);
  vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.scroll { overflow-x: auto; }
.reason { background: var(--bad-soft); color: var(--bad); padding: 6px 10px; border-radius: 8px;
  margin-top: 8px; font-size: 0.9rem; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
.finding { font-size: 0.9rem; padding: 6px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 820px) {
  main { grid-template-columns: minmax(0, 1fr); }
  nav { position: static; max-height: none; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); padding: 6px; }
  nav.collapsed .list { display: none; }
  .filters { justify-content: flex-start; }
  .filters { flex: 1 1 100%; min-width: 0; }
  .filters > * { flex: 1 1 140px; min-width: 0; }
  input[type=search] { flex-basis: 100%; max-width: none; }
  select { width: 100%; max-width: 100%; }
}
@media (min-width: 821px) { .nav-toggle { display: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="stats" id="stats"></div>
</header>
<div class="bar">
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="catalog" aria-selected="true">Catalog</button>
    <button role="tab" data-tab="review" aria-selected="false">Review</button>
    <button role="tab" data-tab="findings" aria-selected="false">Findings</button>
  </div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search features, endpoints, tests" aria-label="Search">
    <select id="role" aria-label="Role"><option value="">All roles</option></select>
    <select id="channel" aria-label="Channel"><option value="">All channels</option></select>
    <select id="proof" aria-label="Evidence"><option value="">Any evidence</option>
      <option value="proven">Proven</option><option value="partial">Partly proven</option>
      <option value="unproven">Not proven</option><option value="static">Not checked</option></select>
    <button class="theme" id="theme" type="button">Light / dark</button>
  </div>
</div>
<main>
  <nav id="nav" class="collapsed" aria-label="Areas">
    <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false">Areas ▾</button>
    <div class="list" id="navList"></div>
  </nav>
  <section id="content" aria-live="polite"></section>
</main>
<script type="application/json" id="data">__DATA__</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('data').textContent);
  const state = { tab: 'catalog', area: null, group: null, q: '', role: '', channel: '', proof: '' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  const purpose = (e) => e.summary || (e.handler || '').split(':').pop().replace(/_/g, ' ');
  const PROOF = { proven: 'proven', partial: 'partly proven', unproven: 'not proven', static: 'not checked' };

  try { const t = localStorage.getItem('catalog-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $('theme').onclick = () => {
    const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('catalog-theme', next); } catch (e) {}
  };
  $('navToggle').onclick = () => {
    const nav = $('nav'); nav.classList.toggle('collapsed');
    $('navToggle').setAttribute('aria-expanded', String(!nav.classList.contains('collapsed')));
  };

  $('title').textContent = data.title;
  $('sub').textContent = `Generated ${data.generatedAt}` + (data.reportsChecked ? ' · test results checked' : ' · static check only (no test reports)');
  const s = data.stats;
  const tiles = [[`${s.features}`, 'features'], [`${s.proven}/${s.features}`, 'proven by tests'],
    [`${s.catalogued}/${s.areas}`, 'areas catalogued'], [`${s.assigned}/${s.parts}`, 'parts assigned'],
    [`${s.review}`, 'in review'], [`${s.errors} / ${s.warnings}`, 'errors / warnings']];
  $('stats').innerHTML = tiles.map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');

  const roles = [...new Set(data.features.flatMap((f) => f.roles))].sort();
  $('role').innerHTML += roles.map((r) => `<option>${esc(r)}</option>`).join('');
  $('channel').innerHTML += Object.entries(data.channels).map(([k, v]) => `<option value="${esc(k)}">${esc(k)} – ${esc(v)}</option>`).join('');
  for (const id of ['q', 'role', 'channel', 'proof']) $(id).addEventListener('input', (e) => { state[id] = e.target.value.trim().toLowerCase(); render(); });
  document.querySelectorAll('[role=tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; render(); });

  const haystack = (f) => JSON.stringify([f.id, f.title, f.summary, f.description, f.usage, f.rules, f.acceptance, f.technical, f.evidence]).toLowerCase();
  function visible(f) {
    if ((state.tab === 'review') !== Boolean(f.state)) return false;
    if (state.area && f.area !== state.area) return false;
    if (state.group && f.group !== state.group) return false;
    if (state.role && !f.roles.includes(state.role)) return false;
    if (state.channel && !f.channels.includes(state.channel)) return false;
    if (state.proof && f.proof !== state.proof) return false;
    return !state.q || haystack(f).includes(state.q);
  }

  function renderNav() {
    const counts = (pred) => data.features.filter((f) => (state.tab === 'review') === Boolean(f.state) && pred(f)).length;
    let html = `<button data-area="" class="${state.area ? '' : 'active'}">All areas<span class="count">${counts(() => true)}</span></button>`;
    for (const a of data.areas) {
      html += `<button data-area="${esc(a.id)}" class="${state.area === a.id && !state.group ? 'active' : ''}">${esc(a.title)}<span class="count">${a.status === 'open' ? 'open · ' : ''}${counts((f) => f.area === a.id)}</span></button>`;
      if (state.area === a.id) for (const g of a.groups) html += `<button class="group ${state.group === g.id ? 'active' : ''}" data-area="${esc(a.id)}" data-group="${esc(g.id)}">${esc(g.title)}<span class="count">${counts((f) => f.group === g.id)}</span></button>`;
    }
    $('navList').innerHTML = html;
    $('navList').querySelectorAll('button').forEach((b) => b.onclick = () => { state.area = b.dataset.area || null; state.group = b.dataset.group || null; render(); });
  }

  function evidenceRow(e) {
    const flags = [e.statusOnly ? 'status only' : '', e.related === false ? 'no link to feature' : ''].filter(Boolean).join(', ');
    return `<tr><td><span class="chip ${esc(e.status)}">${esc(e.status)}</span></td><td>${esc(e.kind)}</td><td><code>${esc(e.file)}${e.line ? ':' + e.line : ''}</code><br>${esc(e.test)}</td><td>${esc(e.covers.join(', '))}</td><td>${esc(e.assertions)}${flags ? ' · ' + esc(flags) : ''}</td></tr>`;
  }

  function card(f) {
    const covered = (c) => !f.uncovered.includes(c.id);
    const tech = f.technical;
    const endpoints = tech.endpoints.length ? `<div class="scroll"><table><tr><th>Endpoint</th><th>Purpose</th><th>Roles</th><th>Called by tests</th></tr>${tech.endpoints.map((e) => `<tr><td><code>${esc(e.key)}</code></td><td>${md(purpose(e))}</td><td>${esc(e.roles.join(', '))}</td><td>${e.calledBy.map((c) => `<code>${esc(c)}</code>`).join('<br>') || '–'}</td></tr>`).join('')}</table></div>` : '';
    const list = (title, items) => items.length ? `<h4>${title}</h4><ul>${items.map((i) => `<li>${i}</li>`).join('')}</ul>` : '';
    return `<article class="card" id="${esc(f.id)}">
      <div class="id">${esc(f.id)}</div><h3>${esc(f.title)}</h3>
      <div class="chips">${f.state ? `<span class="chip state">${esc(f.state)}</span>` : ''}<span class="chip ${esc(f.proof)}">${esc(PROOF[f.proof] || f.proof)}</span>${f.channels.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}${f.roles.map((r) => `<span class="chip">${esc(r)}</span>`).join('')}</div>
      <div>${md(f.summary)}</div>
      ${f.description ? `<p>${md(f.description)}</p>` : ''}
      ${f.reason ? `<div class="reason">${md(f.reason)}</div>` : ''}
      ${list('How to use it', f.usage.map((u) => `<b>${esc(u.channel)}:</b> ${md(u.text)}`))}
      ${list('Rules', f.rules.map(md))}
      ${f.acceptance.length ? `<h4>Acceptance criteria</h4>${f.acceptance.map((c) => `<div class="crit"><span class="mark ${covered(c) ? 'ok' : 'no'}" aria-label="${covered(c) ? 'proven' : 'not proven'}">${covered(c) ? '✓' : '✗'}</span><span><b>${esc(c.kind)}</b> ${md(c.text)}${c.code ? ` <code>${esc(c.code)}</code>` : ''}</span></div>`).join('')}` : ''}
      ${f.dependsOn.length ? `<h4>Depends on</h4>${f.dependsOn.map((d) => `<a href="#${esc(d)}">${esc(d)}</a>`).join(', ')}` : ''}
      <details><summary>Technical details</summary>
        ${endpoints ? `<h4>Endpoints</h4>${endpoints}` : ''}
        ${list('Pages', tech.uiRoutes.map((r) => `<code>${esc(r.path)}</code> ${esc(r.component || '')}${r.guard ? ' · ' + esc(r.guard) : ''}`))}
        ${list('Jobs', tech.jobs.map((j) => `<code>${esc(j.name)}</code>${j.schedule ? ' · daily ' + esc(j.schedule) : ''}`))}
        ${list('Commands', tech.commands.map((c) => `<code>${esc(c)}</code>`))}
        ${list('Components', tech.components.map((c) => `<code>${esc(c)}</code>`))}
        ${list('Settings', tech.settings.map(md))}
        ${list('Notes', tech.notes.map(md))}
        ${f.evidence.length ? `<h4>Evidence</h4><div class="scroll"><table><tr><th>Result</th><th>Kind</th><th>Test</th><th>Covers</th><th>Assertions</th></tr>${f.evidence.map(evidenceRow).join('')}</table></div>` : ''}
        <p class="sub">Source: <code>${esc(f.file)}</code></p>
      </details>
    </article>`;
  }

  function renderFeatures() {
    const shown = data.features.filter(visible);
    if (!shown.length) return `<div class="empty">No features match.</div>`;
    let html = '';
    for (const a of data.areas) {
      const own = shown.filter((f) => f.area === a.id);
      if (!own.length) continue;
      html += `<div class="area-head"><h2>${esc(a.title)}</h2><div class="sub">${md(a.summary)} · ${esc(a.status)} · ${a.assigned}/${a.parts} parts assigned</div></div>`;
      for (const g of a.groups) {
        const inGroup = own.filter((f) => f.group === g.id);
        if (!inGroup.length) continue;
        html += `<div class="group-title">${esc(g.title)}</div>` + inGroup.map(card).join('');
      }
    }
    return html;
  }

  function renderFindings() {
    const items = data.findings.filter((f) => !state.q || JSON.stringify(f).toLowerCase().includes(state.q));
    if (!items.length) return `<div class="empty">No errors or warnings.</div>`;
    return items.map((f) => `<div class="finding"><span class="chip ${esc(f.level)}">${esc(f.level)}</span> <b>${esc(f.code)}</b> ${f.feature ? `<a href="#${esc(f.feature)}">${esc(f.feature)}</a> ` : ''}${md(f.message)}</div>`).join('');
  }

  function render() {
    document.querySelectorAll('[role=tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));
    renderNav();
    $('content').innerHTML = state.tab === 'findings' ? renderFindings() : renderFeatures();
  }
  render();
})();
</script>
</body>
</html>
