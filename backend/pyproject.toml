[project]
name = "weddingplanner-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "boto3>=1.44.3",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "pyotp>=2.11.2",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.33",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.54.0",
    "mypy>=2.4.1",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["app.authz.deps.require", "app.authz.deps.require_project", "fastapi.Depends", "fastapi.Query", "fastapi.Header", "app.portal.service.Access"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*", "factory.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
